services:
  # -------------------------------------------------------------
  # 1. BANCO DE DADOS MYSQL
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: enginelab-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: enginelab
      MYSQL_USER: enginelab_user
      MYSQL_PASSWORD: enginelab_pass
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - enginelab-net

  # -------------------------------------------------------------
  # 2. PHPMYADMIN (Visualizador do Banco de Dados)
  # -------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: enginelab-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      PMA_ARBITRARY: 1
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - enginelab-net

  # -------------------------------------------------------------
  # 3. BACKEND (Laravel PHP 8.3)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./Back
      dockerfile: Dockerfile
    container_name: enginelab-backend
    restart: unless-stopped
    environment:
      APP_NAME: EngineLab
      APP_ENV: local
      APP_KEY: base64:iKEpdzP2R8zCnoPmUfNgQdgnr3kLQh2ExAO79U0Yi9Q=
      APP_DEBUG: "true"
      APP_URL: http://enginelab.ufc.br/back
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: enginelab
      DB_USERNAME: enginelab_user
      DB_PASSWORD: enginelab_pass
      FRONTEND_URL: http://localhost:8083
      FILESYSTEM_DISK: public
    ports:
      - "8000:8000"
    volumes:
      - ./Back:/var/www/html
      - backend_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - enginelab-net
      - proxy

  # -------------------------------------------------------------
  # 4. FRONTEND (React / TanStack Router / Vite)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    container_name: enginelab-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://enginelab.ufc.br/back/api
      INTERNAL_API_URL: http://enginelab.ufc.br/back/api
    ports:
      - "8083:8080"
    volumes:
      - ./Front:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - enginelab-net
      - proxy

# -------------------------------------------------------------
# VOLUMES PERSISTENTES
# -------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local

# -------------------------------------------------------------
# REDE
# -------------------------------------------------------------
networks:
  enginelab-net:
    driver: bridge
  proxy:
    external: true
